spring:
  application:
    name: ms-gastos-comunes
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # spring-cloud-starter-config exige declarar spring.config.import en
  # cualquier perfil activo (falla el arranque si falta). "optional:" lo
  # hace tolerante a que el config-server no esté disponible, igual que
  # ya declaraba application-aws.yml — acá aplica también al perfil local.
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  jackson:
    default-property-inclusion: non_null
  # Host default inocuo: la autoconfiguracion de JavaMailSender solo crea el
  # bean si spring.mail.host existe. Sin esto, el perfil local (que no envia
  # correo real, ver convivo.mail.habilitado) no levanta el contexto porque
  # NotificacionGastosConsumer no encuentra el bean para inyectar.
  # application-aws.yml lo sobreescribe con el host real de Gmail.
  mail:
    host: ${MAIL_HOST:localhost}
  # Las columnas TIMESTAMP de Oracle no guardan zona: sin esto, los Instant
  # se convierten con la zona de la JVM y difieren entre instancias.
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# Sin conexión a Eureka/Config Server salvo que el perfil activo la habilite
# explícitamente (ver application-aws.yml). Evita que el arranque local
# falle intentando resolver un Eureka/Config Server inexistente.
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://admin:admin123@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# --- Microsoft Entra ID (validación JWT autónoma, Nivel 3) ---
# Mismas variables que usa el BFF (ver bff/.env.example) para validar el
# mismo tenant/token de forma independiente.
convivo:
  entra:
    issuer: ${ENTRA_ISSUER:https://login.microsoftonline.com/${ENTRA_TENANT_ID:}/v2.0}
    jwks-uri: ${ENTRA_JWKS_URI:https://login.microsoftonline.com/${ENTRA_TENANT_ID:}/discovery/v2.0/keys}
    audience: ${ENTRA_API_CLIENT_ID:528af346-c37c-40a0-9f7e-30162de3c027}
    claim-de-rol: ${CLAIM_DE_ROL:roles}
    claim-separador: ${CLAIM_SEPARADOR:,}
    claim-map: {}

  # --- Amazon Cognito (residentes): mismas variables que el BFF ---
  # Vacias = no se aceptan tokens de Cognito (solo Entra ID).
  cognito:
    issuer: ${COGNITO_ISSUER:}
    jwks-uri: ${COGNITO_JWKS_URI:}
    client-id: ${COGNITO_APP_CLIENT_ID:}

  # --- Notificación por correo (ver NotificacionGastosConsumer) ---
  # Deshabilitado por defecto: perfil local solo loguea, nunca manda correo
  # real (sin credenciales SMTP en dev). Se activa en application-aws.yml.
  mail:
    habilitado: ${MAIL_HABILITADO:false}
    remitente: ${MAIL_FROM:no-reply@convivo.cl}

  # --- RabbitMQ / Amazon MQ: topología Outbox/Inbox (ver RabbitMqConfig) ---
  mensajeria:
    exchange-eventos: ${RABBITMQ_EXCHANGE_EVENTOS:espacios_events}
    cola-reserva-creada: ${RABBITMQ_COLA_RESERVA_CREADA:gastos_reserva_creada_queue}
    routing-key-reserva-creada: ${RABBITMQ_ROUTING_KEY_RESERVA_CREADA:reserva_espacio_creada}
    routing-key-gasto-fallido: ${RABBITMQ_ROUTING_KEY_GASTO_FALLIDO:gasto_fallido}
    dlx: ${RABBITMQ_DLX:gastos.dlx}
    cola-dead-letter: ${RABBITMQ_COLA_DEAD_LETTER:gastos_reserva_creada_dlq}
    outbox-intervalo-ms: ${OUTBOX_INTERVALO_MS:5000}
    outbox-lote-maximo: ${OUTBOX_LOTE_MAXIMO:50}
    outbox-max-intentos: ${OUTBOX_MAX_INTENTOS:10}
    listener-max-reintentos: ${LISTENER_MAX_REINTENTOS:3}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
