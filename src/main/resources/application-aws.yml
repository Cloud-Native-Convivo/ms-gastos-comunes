# Perfil AWS: contra la infraestructura real ya provisionada (Oracle RDS,
# Amazon MQ, Eureka/Config Server, API Gateway -> BFF -> este servicio).
# Todos los valores sensibles vienen de variables de entorno / AWS Secrets
# Manager inyectadas en la task definition de ECS Fargate — nunca hardcoded.
spring:
  config:
    activate:
      on-profile: aws
    # Config Server opcional: si no está disponible o no se define
    # CONFIG_SERVER_URL, el arranque continúa igual (mismo criterio que
    # usa el BFF con RabbitMQ: "preparado pero tolerante a no-disponibilidad").
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    addresses: ${RABBITMQ_URLS}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
    listener:
      simple:
        auto-startup: true
        prefetch: ${RABBITMQ_PREFETCH:10}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_INSTANCE_HOSTNAME:${HOSTNAME:localhost}}

logging:
  level:
    com.convivo.gastoscomunes: INFO
