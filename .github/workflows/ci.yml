name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

      # En PRs desde forks el token es de solo lectura: se omiten los reportes.
      - name: Resultados de tests
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: target/surefire-reports/*.xml
          check_name: Resultados de tests

      - name: Comentario de cobertura
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 60
          update-comment: true
          title: Cobertura JaCoCo

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint del Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # El Dockerfile compila el jar en una etapa propia, no requiere build previo.
      - name: Construir imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ms-gastos-comunes:pr

      - name: Escaneo de imagen (resumen)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ms-gastos-comunes:pr
          format: table
          output: trivy-resumen.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Publicar resumen de vulnerabilidades
        if: always()
        run: |
          {
            echo '### Trivy: vulnerabilidades de la imagen (CRITICAL, HIGH)'
            echo '```'
            cat trivy-resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Escaneo de imagen (falla en CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ms-gastos-comunes:pr
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
