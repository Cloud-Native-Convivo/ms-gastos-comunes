services:
  oracle-gastos:
    image: gvenzl/oracle-free:23.5-slim
    container_name: oracle-gastos
    restart: unless-stopped
    ports:
      # 1522 en el host: 1521 ya lo ocupa oracle-espacios si corre a la vez.
      - "1522:1521"
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:-oracle_password}
      APP_USER: ${DB_USERNAME:-admin}
      APP_USER_PASSWORD: ${DB_PASSWORD:-oracle_password}
      ORACLE_PDB: freepdb1
    volumes:
      - oracle_gastos_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - convivo-network

  ms-gastos-comunes:
    build: .
    container_name: ms-gastos-comunes
    restart: unless-stopped
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - convivo-network
    environment:
      SPRING_PROFILES_ACTIVE: aws
      DB_URL: jdbc:oracle:thin:@//oracle-gastos:1521/freepdb1
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-oracle_password}
      RABBITMQ_URLS: rabbitmq:5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_SSL_ENABLED: "false"
      EUREKA_URL: http://admin:${EUREKA_PASSWORD:-admin123}@discovery-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    depends_on:
      oracle-gastos:
        condition: service_healthy

volumes:
  oracle_gastos_data:

networks:
  convivo-network:
    external: true
    name: convivo-network
